```yaml
services:
  postgres:
    image: postgres:16
    container_name: browser_agent_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricing_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  browser-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: browser_agent

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./screenshots:/app/screenshots

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pricing_db

    stdin_open: true
    tty: true

volumes:
  postgres_data:
```
